<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>moonbit-supercluster 在线演示 · 广东 10 万点聚合</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  #map { height: 100%; }
  #panel {
    position: absolute; top: 12px; right: 12px; z-index: 1000;
    background: #fff; border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 1px 6px rgba(0,0,0,.25); min-width: 210px;
  }
  #panel h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
  #panel .sub { font-size: 11px; color: #666; margin-bottom: 10px; }
  #panel table { font-size: 12px; border-collapse: collapse; width: 100%; }
  #panel td { padding: 3px 0; }
  #panel td:first-child { color: #666; padding-right: 10px; white-space: nowrap; }
  #panel td:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }
  .cluster-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  #loading {
    position: absolute; inset: 0; z-index: 2000; background: rgba(255,255,255,.92);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 15px; color: #333; gap: 12px;
  }
  #loading .bar { width: 240px; height: 6px; background: #e5e5e5; border-radius: 999px; overflow: hidden; }
  #loading .bar > div { width: 40%; height: 100%; background: #0FDC78; border-radius: 999px; transition: width .3s; }
  .cluster {
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
    font-weight: 600; font-variant-numeric: tabular-nums; text-align: center;
    user-select: none;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>MoonBit supercluster 聚合演示</h1>
  <div class="sub">广东省六城合成数据 · 纯 MoonBit JS 后端</div>
  <table id="stats"></table>
</div>
<div id="loading">
  <div>正在加载 10 万点数据并构建索引…</div>
  <div class="bar"><div id="bar"></div></div>
  <div id="loadmsg" style="font-size:12px;color:#888;"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
